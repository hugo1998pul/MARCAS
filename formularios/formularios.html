<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formr.css">
</head>
<body>
    <form action="#" method="post" enctype="multipart/form-data" oninput="resultado, value=salaria.value">
        <fieldset>
            <legend>Datos personales</legend>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre de pila" required size="50">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasenq" name="contrasena">
            <label for="telefono">telefono</label>
            <input type="number" id="telefono" name="telefono" placeholder="644956875">
            <label for="email">Correo electronico</label>
            <input type="email" id="email" name="email" placeholder="usuario@domino.es">
        </fieldset>
        <fieldset>
            <legend>Otros datos </legend>
            <label for="cita">Fecha medica</label>
            <input type="datetime-local" name="cita" id="cita">
            <label for="hora">Hora</label>
            <input type="time" id="hora" name="hora">
            <label for="mes">Mes</label>
            <input type="month" id="mes" name="mes">
            <label for="semanas">Semanas</label>
            <input type="week" id="semanas" name="semanas">  
            <label for="cv">CV</label>
            <input type="file" id="cv" name="cv">
            <label for="salario">Salario</label>
            <input type="range" id="salario" name="salario" min="20000" max="600000" step="1000" r>
            <label for="buscar">Buscar</label>
            <input type="search" id="buscar" name="buscar">
            <label for="comentarios">Comentarios</label>
            <textarea name="comentarios" id="comentarios" cols="40" rows="6" placeholder="escriba su comentario"></textarea>
            <input type="submit" value="registrarme">
            <input type="reset" value="Borrar formulario">
            <input type="button" value="boton tonto">
        </fieldset>
    </form> 
</body>
</html>
