<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romanescu</title>
    <style>
        body{
            height: 100vh;
            font-size: 0;
            width: 80%;
            margin: auto;
        }
        div{
            display: inline-block;
            border: 2px solid black;
            box-sizing: border-box;
            font-size: 16px;
            height: 30%;
            color: white;
            vertical-align: top;
        }
        div:first-of-type{
            background-color: red;
            width: 70%;
        }
        div:nth-of-type(2){
            background-color: blue;
            width: 30%;
            font-size: 0;
        }
        div:nth-of-type(3){
            background-color: green;
            width: 40%;
        }
        div:nth-of-type(4){
            background-color: yellow;
            width: 60%;
            color: black;
        }
        div:nth-of-type(5){
            background-color:blueviolet;
            width: 60%;
        }
        div:nth-of-type(6){
            background-color: grey;
            width: 40%;
        }
        div:last-of-type{
            background-color: black;
            width: 100%;
            height: 10%;
        }
    </style>
</head>
<body>
        <div>1</div>
        <div>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        </div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
</body>
</html>
